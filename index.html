function getProductStatusSummary(p){var vs=p.variants||[];if(vs.length===0)return "tersedia";var ht=false,hp=false,hh=false;for(var i=0;i<vs.length;i++){var s=vs[i].status||"tersedia";if(s==="tersedia")ht=true;else if(s==="po")hp=true;else if(s==="habis")hh=true;}if(ht)return "tersedia";if(hp)return "po";return "habis";}
function renderCatBar(){var bar=document.getElementById("catBar");var cats=DATA.categories||[];if(cats.length===0){bar.innerHTML="";return;}var h="<button class='cat-btn"+(activeCat==="all"?" active":"")+"' onclick='filterCat(\"all\")'>Semua</button>";for(var i=0;i<cats.length;i++){var c=cats[i];h+="<button class='cat-btn"+(activeCat===c.id?" active":"")+"' onclick='filterCat(\""+c.id+"\")'>"+c.name+"</button>";}bar.innerHTML=h;}
function filterCat(id){activeCat=id;renderCatBar();renderGrid();}
function renderGrid(){var g=document.getElementById("grid");var prods=DATA.products||[];if(activeCat!=="all"){prods=prods.filter(function(p){return p.categoryId===activeCat;});}if(prods.length===0){g.innerHTML="<p class='text-center text-slate-400 py-10'>Belum ada produk</p>";return;}var h="";for(var i=0;i<prods.length;i++){var p=prods[i];var rv=DATA.reviews.filter(function(r){return r.productId===p.id});var a=rv.length?(rv.reduce(function(s,r){return s+r.rating},0)/rv.length).toFixed(1):"0.0";var im=p.image?"<img src='"+p.image+"' class='w-full h-auto max-h-96 object-contain p-2 rounded-xl'>":"<i class='fas fa-image text-5xl text-slate-300'></i>";var vs=p.variants||[];var minPrice=p.price;if(vs.length>0){minPrice=vs[0].price;for(var vi=1;vi<vs.length;vi++){if(vs[vi].price<minPrice)minPrice=vs[vi].price;}}var priceText=vs.length>1?"Mulai dari "+rp(minPrice):rp(minPrice);var catName="";for(var ci=0;ci<(DATA.categories||[]).length;ci++){if(DATA.categories[ci].id===p.categoryId){catName=DATA.categories[ci].name;break;}}var catTag=catName?"<span class='inline-block bg-amber-100 text-amber-700 text-xs font-semibold px-2 py-0.5 rounded-full'><i class='fas fa-tag'></i> "+catName+"</span>":"";var summary=getProductStatusSummary(p);h+="<div class='glass rounded-3xl overflow-hidden cursor-pointer card-hover flex flex-col' onclick='openP(\""+p.id+"\")'><div class='bg-slate-50 flex items-center justify-center overflow-hidden p-2'>"+im+"</div><div class='p-5 flex-1 flex flex-col'>"+statusBadge(summary)+" "+catTag+"<h3 class='font-bold text-lg text-slate-800 mt-2'>"+p.name+"</h3><p class='text-sm text-slate-500 clamp mt-1'>"+(p.description||"")+"</p><div class='flex justify-between items-center mt-4 pt-3 border-t border-white/60'><span class='text-teal-600 font-bold'>"+priceText+"</span><span class='text-amber-500 text-sm font-semibold'>★ "+a+"</span></div></div></div>";}g.innerHTML=h;}
function init(){
  document.getElementById("navTitle").innerText=DATA.settings.name;
  document.getElementById("storeName").innerText=DATA.settings.name;
  document.getElementById("storeDesc").innerText=DATA.settings.desc;
  document.getElementById("cntProduk").innerText=DATA.products.length;
  var t=DATA.reviews.length?(DATA.reviews.reduce(function(s,r){return s+r.rating},0)/DATA.reviews.length).toFixed(1):"0.0";
  document.getElementById("cntRating").innerText=t;
  document.getElementById("lkTt").href=TIKTOK_LINK;
  document.getElementById("lkIg").href=IG_LINK;
  renderCatBar();renderGrid();
  history.replaceState({page:"home"},"","");
}
function openP(id){
  var p=null;for(var i=0;i<DATA.products.length;i++){if(DATA.products[i].id===id){p=DATA.products[i];break;}}
  if(!p)return;
  currentProduct=p;selectedVariantIndex=0;qty=1;descExpanded=false;
  document.getElementById("qtyInput").value=1;
  document.getElementById("dTitle").innerText=p.name;
  var catName="";for(var ci=0;ci<(DATA.categories||[]).length;ci++){if(DATA.categories[ci].id===p.categoryId){catName=DATA.categories[ci].name;break;}}
  var dcat=document.getElementById("dCat");
  if(catName){dcat.innerText="📁 "+catName;dcat.style.display="block";}else{dcat.style.display="none";}
  var dDesc=document.getElementById("dDesc");dDesc.innerText=p.description||"";
  var descToggle=document.getElementById("descToggle");
  if((p.description||"").length>200){descToggle.style.display="inline-block";dDesc.classList.add("desc-clamp");descToggle.innerHTML="Baca Selengkapnya <i class='fas fa-chevron-down text-xs'></i>";}else{descToggle.style.display="none";dDesc.classList.remove("desc-clamp");}
  if(p.image){document.getElementById("dImg").innerHTML="<img src='"+p.image+"' class='detail-img w-full h-auto max-h-96 object-contain p-2 rounded-xl' onclick='openLb(\""+p.image+"\")'>";}else{document.getElementById("dImg").innerHTML="<i class='fas fa-image text-6xl text-slate-300'></i>";}
  renderVariantList(p);updateTotal();updateBuyButton();
  var rl=document.getElementById("rList");var rv=DATA.reviews.filter(function(r){return r.productId===p.id});
  if(rv.length===0){rl.innerHTML="<p class='text-sm text-slate-400 italic'>Belum ada ulasan</p>";}else{var h="";for(var i=0;i<rv.length;i++){var r=rv[i];var thumb=r.image?"<img src='"+r.image+"' class='thumb w-16 h-16 object-cover rounded-lg mt-2 border-2 border-white shadow-md' onclick='openLb(\""+r.image+"\")'>":"";h+="<div class='bg-white/70 rounded-2xl p-4 border border-white'><div class='flex justify-between'><b class='text-sm text-slate-800'>"+r.name+"</b><span class='text-amber-500 text-xs'>"+"★".repeat(r.rating)+"</span></div><p class='text-sm mt-2 text-slate-600 leading-relaxed'>"+r.text+"</p>"+thumb+"</div>";}rl.innerHTML=h;}
  history.pushState({page:"product"},"","");
  showPage("product");
}
function toggleDesc(){var dDesc=document.getElementById("dDesc");var btn=document.getElementById("descToggle");if(descExpanded){dDesc.classList.add("desc-clamp");btn.innerHTML="Baca Selengkapnya <i class='fas fa-chevron-down text-xs'></i>";descExpanded=false;}else{dDesc.classList.remove("desc-clamp");btn.innerHTML="Tutup Deskripsi <i class='fas fa-chevron-up text-xs'></i>";descExpanded=true;}}
function renderVariantList(p){var vl=document.getElementById("variantList");var variants=p.variants||[];var vh="";for(var i=0;i<variants.length;i++){var v=variants[i];var st=v.status||"tersedia";var cls="variant-item";if(i===selectedVariantIndex)cls+=" active";if(st==="habis")cls+=" disabled";var onclickAttr=st==="habis"?"":"onclick='selectVariant("+i+")'";var statusTag="";if(st==="habis")statusTag="<span class='status-badge status-habis mt-1'><i class='fas fa-times-circle'></i> Tidak Tersedia</span>";else if(st==="po")statusTag="<span class='status-badge status-po mt-1'><i class='fas fa-clock'></i> Pre-Order</span>";else statusTag="<span class='status-badge status-tersedia mt-1'><i class='fas fa-check-circle'></i> Tersedia</span>";vh+="<div class='"+cls+"' data-idx='"+i+"' "+onclickAttr+"><div><span class='font-semibold text-slate-700 text-sm'>"+v.name+"</span><div class='mt-1'>"+statusTag+"</div></div><div style='text-align:right'><div class='price'>"+rp(v.price)+"</div></div></div>";}vl.innerHTML=vh;}
function selectVariant(i){var p=currentProduct;if(!p)return;var v=(p.variants||[])[i];if(!v)return;var st=v.status||"tersedia";if(st==="habis")return;selectedVariantIndex=i;renderVariantList(p);updateTotal();updateBuyButton();}
function getCurrentVariant(){if(!currentProduct)return null;var vs=currentProduct.variants||[];if(vs.length===0)return null;return vs[selectedVariantIndex]||vs[0];}
function getCurrentPrice(){if(!currentProduct)return 0;var v=getCurrentVariant();if(v)return v.price;return currentProduct.price;}
function updateTotal(){var total=getCurrentPrice()*qty;document.getElementById("totalPrice").innerText=rp(total);}
function updateBuyButton(){var btn=document.getElementById("buyBtn");var v=getCurrentVariant();var st=v?(v.status||"tersedia"):"tersedia";if(st==="habis"){btn.className="btn-disabled w-full py-4 rounded-2xl font-bold mt-4";btn.innerHTML="<i class='fas fa-times-circle'></i> Stok Habis";btn.disabled=true;}else if(st==="po"){btn.className="btn-po w-full text-white py-4 rounded-2xl font-bold mt-4";btn.innerHTML="<i class='fas fa-clock'></i> Pre-Order Sekarang";btn.disabled=false;}else{btn.className="btn-buy w-full text-white py-4 rounded-2xl font-bold mt-4";btn.innerHTML="<i class='fas fa-shopping-cart'></i> Beli Sekarang";btn.disabled=false;}}
function changeQty(d){qty=qty+d;if(qty<1)qty=1;document.getElementById("qtyInput").value=qty;updateTotal();}
function syncQty(){var v=parseInt(document.getElementById("qtyInput").value)||1;if(v<1)v=1;qty=v;document.getElementById("qtyInput").value=qty;updateTotal();}
function buyNow(){if(!currentProduct)return;var v=getCurrentVariant();var st=v?(v.status||"tersedia"):"tersedia";if(st==="habis")return;var price=getCurrentPrice();var total=price*qty;var varText="";if(v){varText="\nVarian: "+v.name;}var prefix=st==="po"?"Halo, saya mau PESAN PRE-ORDER (konfirmasi dulu ya):":"Halo, saya mau beli:";var m=encodeURIComponent(prefix+"\n\n*"+currentProduct.name+"*"+varText+"\nJumlah: "+qty+"\nTotal: "+rp(total));window.open("https://wa.me/"+WA+"?text="+m,"_blank");}
window.addEventListener("popstate",function(e){
  var activePage=document.querySelector(".page.active");
  if(activePage&&activePage.id==="page-product"){
    showPage("home");
  }
  history.pushState({page:"home"},"","");
});
init();
</script>
</body>
</html>
